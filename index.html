  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="icon.svg" alt="" class="brand-logo">
        <div><div class="brand-name">MediScan AI</div><div class="brand-sub" data-t="tagline"></div></div>
      </div>
      <nav class="nav" role="tablist">
        <button class="tab active" data-view="scan" role="tab"><svg class="ic"><use href="#i-scan"/></svg><span data-t="tabScan"></span></button>
        <button class="tab" data-view="check" role="tab"><svg class="ic"><use href="#i-shield-alert"/></svg><span data-t="tabCheck"></span><i id="badge" class="badge" hidden></i></button>
        <button class="tab" data-view="chat" role="tab"><svg class="ic"><use href="#i-bot"/></svg><span data-t="tabChat"></span></button>
        <button class="tab" data-view="settings" role="tab"><svg class="ic"><use href="#i-sliders"/></svg><span data-t="tabSet"></span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="emerg-pill"><svg class="ic"><use href="#i-phone"/></svg><span data-t="emergLine"></span></div>
        <p data-t="disclaimer"></p>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="brand brand-mobile"><img src="icon.svg" alt="" class="brand-logo"><div class="brand-name">MediScan AI</div></div>
        <div class="top-actions">
          <button id="btnFont" class="icon-btn" aria-label="Font size" title="A+"><svg class="ic"><use href="#i-text"/></svg></button>
          <div class="seg" role="group" aria-label="Language">
            <button data-lang="en">EN</button><button data-lang="uz">UZ</button>
          </div>
        </div>
      </header>

      <main>
        <!-- ============ SCAN ============ -->
        <section id="view-scan" class="view active" aria-labelledby="h-scan">
          <div class="hero">
            <div class="hero-text">
              <h1 id="h-scan" data-t="scanTitle"></h1>
              <p data-t="scanSub"></p>
            </div>
          </div>

          <div class="panel">
            <label class="dropzone" id="dropzone">
              <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
              <img id="photoPreview" alt="" hidden>
              <div id="dropHint" class="drop-hint">
                <span class="drop-icon"><svg class="ic lg"><use href="#i-camera"/></svg></span>
                <b data-t="takePhoto"></b>
                <span class="muted small" data-t="photoTip"></span>
              </div>
              <button type="button" id="btnClearPhoto" class="icon-btn floating" hidden aria-label="Remove photo"><svg class="ic"><use href="#i-x"/></svg></button>
            </label>
            <button id="btnRecognize" class="btn primary wide" disabled><svg class="ic"><use href="#i-scan"/></svg><span data-t="recognize"></span></button>
            <div id="scanStatus" class="status" role="status" aria-live="polite"></div>

            <div class="divider"><span data-t="orType"></span></div>
            <div class="search">
              <svg class="ic search-ic"><use href="#i-search"/></svg>
              <input id="manualName" class="input with-ic" data-tp="typeName" autocomplete="off" aria-autocomplete="list">
              <button id="btnManual" class="btn primary" data-t="find"></button>
              <ul class="suggest-list" id="manualSuggest" role="listbox" hidden></ul>
            </div>
            <div class="quick" id="quickChips"></div>
          </div>

          <div id="drugResult"></div>
        </section>

        <!-- ============ CHECK ============ -->
        <section id="view-check" class="view" aria-labelledby="h-check">
          <div class="page-head">
            <span class="page-icon warn-tone"><svg class="ic"><use href="#i-shield-alert"/></svg></span>
            <div><h1 id="h-check" data-t="checkTitle"></h1><p class="muted" data-t="checkSub"></p></div>
          </div>
          <div class="panel">
            <div class="search">
              <svg class="ic search-ic"><use href="#i-search"/></svg>
              <input id="addName" class="input with-ic" data-tp="typeShort" autocomplete="off" aria-autocomplete="list">
              <button id="btnAdd" class="btn primary"><svg class="ic"><use href="#i-plus"/></svg><span data-t="add"></span></button>
              <ul class="suggest-list" id="addSuggest" role="listbox" hidden></ul>
            </div>
            <div id="addError" class="status error" role="alert"></div>
            <div class="list-head"><b data-t="myMeds"></b><button id="btnClearList" class="link-btn" data-t="clearAll" hidden></button></div>
            <div id="myList" class="med-list"></div>
          </div>
          <div id="checkSummary"></div>
          <div id="checkResult" aria-live="polite"></div>
        </section>

        <!-- ============ AI ASSISTANT ============ -->
        <section id="view-chat" class="view chat-view" aria-labelledby="h-chat">
          <div class="page-head">
            <span class="page-icon ai-tone"><svg class="ic"><use href="#i-bot"/></svg></span>
            <div><h1 id="h-chat" data-t="chatTitle"></h1><p class="muted" data-t="chatSub"></p></div>
          </div>
          <div id="chatLog" class="chat-log" aria-live="polite"></div>
          <div class="suggest-chips" id="suggest"></div>
          <form id="chatForm" class="composer">
            <textarea id="chatInput" rows="1" data-tp="chatPlaceholder"></textarea>
            <button class="send-btn" id="btnSend" aria-label="Send"><svg class="ic"><use href="#i-send"/></svg></button>
          </form>
          <label class="toggle-row"><input type="checkbox" id="shareMeds"><span class="switch"></span><span data-t="shareMeds"></span></label>
        </section>

        <!-- ============ SETTINGS ============ -->
        <section id="view-settings" class="view" aria-labelledby="h-set">
          <div class="page-head">
            <span class="page-icon"><svg class="ic"><use href="#i-sliders"/></svg></span>
            <div><h1 id="h-set" data-t="setTitle"></h1></div>
          </div>
          <div class="panel">
            <h3 class="panel-title"><svg class="ic"><use href="#i-key"/></svg><span data-t="aiKeyTitle"></span></h3>
            <p class="muted small" data-t="aiKeySub"></p>
            <label class="field-label" for="apiKey">API key</label>
            <input id="apiKey" type="password" class="input" placeholder="AIza..." autocomplete="off">
            <label class="field-label" for="apiModel" data-t="modelLabel"></label>
            <input id="apiModel" class="input" placeholder="gemini-flash-lite-latest">
            <button id="btnSaveKey" class="btn primary"><svg class="ic"><use href="#i-check-sm"/></svg><span data-t="save"></span></button>
            <div id="keyStatus" class="status"></div>
          </div>
          <div class="panel">
            <h3 class="panel-title"><svg class="ic"><use href="#i-lock"/></svg><span data-t="privacyTitle"></span></h3>
            <ul class="check-list" id="privacyList"></ul>
            <button id="btnWipe" class="btn danger"><svg class="ic"><use href="#i-trash"/></svg><span data-t="wipe"></span></button>
          </div>
          <div class="panel">
            <h3 class="panel-title"><svg class="ic"><use href="#i-database"/></svg><span data-t="sourcesTitle"></span></h3>
            <p class="muted small" data-t="sourcesText"></p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- First-launch consent -->
  <div id="consent" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="consentTitle">
      <span class="modal-icon"><svg class="ic lg"><use href="#i-shield"/></svg></span>
      <h2 id="consentTitle" data-t="consentTitle"></h2>
      <p class="muted" data-t="consentSub"></p>
      <ul class="check-list" id="consentList"></ul>
      <button id="btnConsent" class="btn primary wide" data-t="consentOk"></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
  <script src="drugs.js?v=10"></script>
  <script src="db1.js?v=10"></script>
  <script src="db2.js?v=10"></script>
  <script src="db3.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
